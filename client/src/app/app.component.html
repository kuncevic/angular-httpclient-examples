<div class="container">
  <div class="buttons">
    <button class="btn btn-node" (click)="callServer(3000)">Post to Node.js</button>
    <button class="btn btn-dotnet" (click)="callServer(3001)">Post to .NET</button>
    <button class="btn btn-go" (click)="callServer(3002)">Post to Go</button>
  </div>

  <div class="response">
    @if (response()) {
      <span class="label">Response</span>
      <pre>{{ response() | json }}</pre>
    }
  </div>
</div>
